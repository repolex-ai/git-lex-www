title: git-lex
description: Git extensions for knowledge graphs
url: https://git-lex.com
baseurl: ""

markdown: kramdown

collections:
  docs:
    output: true
    permalink: /docs/:title/
    sort_by: order

defaults:
  - scope:
      path: ""
      type: "docs"
    values:
      layout: "docs"

exclude:
  - README.md
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
